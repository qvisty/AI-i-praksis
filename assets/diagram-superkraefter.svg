    <path d="M420 48 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#34c08e"/>
    <path d="M540 170 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#34c08e"/>
  </g>
</svg>
