    <path d="M452 172 q-16 -26 -22 -58" stroke="#007a53" stroke-width="13" stroke-linecap="round" fill="none"/>
    <circle cx="428" cy="108" r="9" fill="#0f9d68"/>
    <path d="M500 172 q18 24 26 54" stroke="#007a53" stroke-width="13" stroke-linecap="round" fill="none"/>
    <circle cx="528" cy="232" r="9" fill="#0f9d68"/>
    <circle cx="476" cy="182" r="15" fill="#ffffff"/>
    <path d="M479 170 l-8 14 h6 l-5 12 12 -16 h-6 l7 -10 z" fill="#0f9d68"/>
  </g>

