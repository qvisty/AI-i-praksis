<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .lens { animation: seek 7s ease-in-out infinite; transform-box: view-box; transform-origin: center; }
    @keyframes seek {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-30px, 34px); }
      55% { transform: translate(26px, 64px); }
      80% { transform: translate(-10px, 10px); }
    }
    @media (prefers-reduced-motion: reduce) { .lens { animation: none; } }
  </style>
  <rect x="56" y="24" width="180" height="192" rx="12" fill="none" stroke="#94a3b8" stroke-width="3"/>
