  <rect x="76" y="72" width="120" height="7" rx="3.5" fill="#94a3b8" opacity="0.6"/>
  <rect x="76" y="90" width="104" height="7" rx="3.5" fill="#94a3b8" opacity="0.6"/>
  <rect x="76" y="114" width="52" height="10" rx="5" fill="#0f9d68"/>
