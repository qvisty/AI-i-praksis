<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .b1 { animation: appear 5s ease-in-out infinite; }
    .b2 { animation: appear 5s ease-in-out 0.6s infinite; }
    .b3 { animation: appear 5s ease-in-out 1.2s infinite; }
    .b4 { animation: appear 5s ease-in-out 1.8s infinite; }
    .bubble { animation: f 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes appear { 0%, 10% { opacity: 0; } 30%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect x="24" y="36" width="220" height="168" rx="14" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <line x1="24" y1="66" x2="244" y2="66" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="44" cy="51" r="5" fill="#94a3b8"/>
  <circle cx="62" cy="51" r="5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="80" cy="51" r="5" fill="#94a3b8" opacity="0.35"/>
  <rect class="b1" x="44" y="84" width="120" height="16" rx="6" fill="#007a53"/>
  <rect class="b2" x="44" y="112" width="180" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
  <rect class="b3" x="44" y="130" width="150" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
  <rect class="b4" x="44" y="156" width="86" height="28" rx="14" fill="#0f9d68"/>
  <g class="bubble">
    <rect x="216" y="140" width="86" height="44" rx="14" fill="#007a53"/>
    <path d="M234 184 l-6 12 18 -12 z" fill="#007a53"/>
    <rect x="230" y="152" width="58" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="230" y="164" width="40" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
