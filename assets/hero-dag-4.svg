<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .beam { animation: tilt 7s ease-in-out infinite; transform-origin: 160px 64px; }
    @keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .beam { animation: none !important; } }
  </style>
  <rect x="120" y="200" width="80" height="10" rx="5" fill="#94a3b8"/>
  <rect x="155" y="64" width="10" height="140" rx="5" fill="#94a3b8"/>
