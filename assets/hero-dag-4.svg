      <circle cx="70" cy="88" r="3.5" fill="#ffffff"/>
      <path d="M64 76 V68" stroke="#007a53" stroke-width="3" stroke-linecap="round"/>
      <circle cx="64" cy="66" r="3" fill="#34c08e"/>
    </g>
    <g>
