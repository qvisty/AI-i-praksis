    <path d="M64 68 V104 M256 68 V104" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 104 q32 36 64 0 z" fill="#0f9d68"/>
    <path d="M224 104 q32 36 64 0 z" fill="#0f9d68"/>
    <g>
