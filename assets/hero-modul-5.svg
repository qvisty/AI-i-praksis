<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .bar { transform-box: fill-box; transform-origin: center; animation: eq 1.4s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.4s; }
    .d4 { animation-delay: 0.6s; } .d5 { animation-delay: 0.8s; } .d6 { animation-delay: 1s; }
    @keyframes eq { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none !important; } }
  </style>
