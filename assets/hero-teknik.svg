<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .out1 { animation: appear 5s ease-in-out infinite; }
    .out2 { animation: appear 5s ease-in-out 0.6s infinite; }
    .out3 { animation: appear 5s ease-in-out 1.2s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes appear { 0%, 8% { opacity: 0; } 22%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect x="30" y="40" width="260" height="160" rx="14" fill="#14181f"/>
  <circle cx="52" cy="60" r="5" fill="#94a3b8"/>
  <circle cx="70" cy="60" r="5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="88" cy="60" r="5" fill="#94a3b8" opacity="0.35"/>
  <text x="50" y="98" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#34c08e">$</text>
  <rect x="66" y="86" width="96" height="10" rx="5" fill="#e8ecf3" opacity="0.9"/>
  <rect class="out1" x="50" y="112" width="150" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
  <rect class="out2" x="50" y="130" width="190" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
  <rect class="out3" x="50" y="148" width="120" height="8" rx="4" fill="#0f9d68"/>
  <text x="50" y="182" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#34c08e">$</text>
  <rect class="cursor" x="66" y="170" width="10" height="14" fill="#e8ecf3"/>
</svg>
