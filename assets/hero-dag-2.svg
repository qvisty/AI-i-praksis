<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .eq rect { transform-box: fill-box; transform-origin: bottom; }
    .e1 { animation: eq 1.7s ease-in-out infinite; }
    .e2 { animation: eq 1.7s ease-in-out 0.25s infinite; }
    .e3 { animation: eq 1.7s ease-in-out 0.5s infinite; }
    .e4 { animation: eq 1.7s ease-in-out 0.75s infinite; }
    .sun { animation: pulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="24" y="36" width="184" height="140" rx="14" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle class="sun" cx="70" cy="78" r="15" fill="#34c08e"/>
