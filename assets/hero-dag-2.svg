  <g class="eq">
    <rect class="e1" x="232" y="96" width="14" height="80" rx="7" fill="#69a58f"/>
    <rect class="e2" x="254" y="72" width="14" height="104" rx="7" fill="#0f9d68"/>
    <rect class="e3" x="276" y="88" width="14" height="88" rx="7" fill="#007a53"/>
    <rect class="e4" x="298" y="110" width="14" height="66" rx="7" fill="#34c08e"/>
  </g>
  <path d="M24 204 H312" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
