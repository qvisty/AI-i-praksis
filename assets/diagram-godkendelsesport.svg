<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="Agenten arbejder, du godkender ved porten, og først derefter sendes resultatet">
  <style>
    text { font-family: system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    text.cap { font-weight: 400; font-size: 12px; fill: #64748b; }
    .bar { animation: gate 6s ease-in-out infinite; transform-origin: 206px 96px; }
    .dot { animation: travel 6s ease-in-out infinite; }
    @keyframes gate { 0%, 38% { transform: rotate(0deg); } 50%, 82% { transform: rotate(-58deg); } 94%, 100% { transform: rotate(0deg); } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 38% { transform: translateX(64px); } 52% { transform: translateX(64px); } 80% { transform: translateX(160px); opacity: 1; } 88%, 100% { transform: translateX(160px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none !important; } .dot { animation: none !important; opacity: 0; } }
  </style>
  <path d="M126 104 H296" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
  <circle class="dot" cx="134" cy="104" r="6" fill="#34c08e"/>
  <g>
    <rect x="10" y="86" width="110" height="36" rx="18" fill="#0f9d68"/>
    <text x="65" y="109" text-anchor="middle">AGENTEN</text>
  </g>
  <g>
    <rect x="300" y="86" width="110" height="36" rx="18" fill="#007a53"/>
    <text x="355" y="109" text-anchor="middle">RESULTATET</text>
  </g>
  <rect x="200" y="92" width="10" height="46" rx="5" fill="#94a3b8"/>
  <rect class="bar" x="204" y="92" width="66" height="9" rx="4.5" fill="#8a3324"/>
  <g>
    <circle cx="166" cy="44" r="10" fill="#007a53"/>
    <path d="M150 72 q16 -20 32 0 z" fill="#007a53"/>
  </g>
  <text class="cap" x="206" y="160" text-anchor="middle">din godkendelsesport</text>
</svg>
