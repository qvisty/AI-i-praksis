<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-hidden="true">
  <style>
    .k1 { animation: ind 6s ease-in-out infinite; }
    .k2 { animation: ind 6s ease-in-out 0.5s infinite; }
    .k3 { animation: ind 6s ease-in-out 1s infinite; }
    .oeje { animation: blink 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .svar { animation: svaev 5s ease-in-out infinite; }
    @keyframes ind { 0%, 6% { opacity: 0; transform: translateX(-12px); } 20%, 86% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.15); } }
    @keyframes svaev { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <g class="k1">
    <rect x="18" y="48" width="104" height="30" rx="10" fill="#007a53"/>
    <rect x="30" y="59" width="64" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
  </g>
  <g class="k2">
    <rect x="18" y="96" width="104" height="30" rx="10" fill="#0f9d68"/>
    <rect x="30" y="107" width="50" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
  </g>
  <g class="k3">
    <rect x="18" y="144" width="104" height="30" rx="10" fill="#69a58f"/>
    <rect x="30" y="155" width="72" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
  </g>
  <path d="M130 63 C 150 63, 150 110, 166 110 M130 111 H166 M130 159 C 150 159, 150 112, 166 112" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 8"/>
  <g>
    <rect x="170" y="74" width="96" height="78" rx="20" fill="#00454E"/>
    <path d="M218 74 V58" stroke="#00454E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="218" cy="54" r="7" fill="#34c08e"/>
    <rect class="oeje" x="194" y="100" width="14" height="18" rx="7" fill="#34c08e"/>
    <rect class="oeje" x="228" y="100" width="14" height="18" rx="7" fill="#34c08e"/>
    <rect x="200" y="130" width="36" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>
  <g class="svar">
    <rect x="196" y="168" width="104" height="44" rx="14" fill="#007a53"/>
    <path d="M214 168 l-4 -12 16 12 z" fill="#007a53"/>
