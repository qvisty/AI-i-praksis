  <style>
    .s1 { animation: appear 6s ease-in-out infinite; }
    .s2 { animation: appear 6s ease-in-out 0.7s infinite; }
    .s3 { animation: appear 6s ease-in-out 1.4s infinite; }
    .s4 { animation: appear 6s ease-in-out 2.1s infinite; }
    .spark { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes appear { 0%, 8% { opacity: 0; } 22%, 86% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
