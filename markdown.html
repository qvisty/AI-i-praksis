<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiale | AI i praksis</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

<nav>
  <div class="inner">
    <a class="brand" href="index.html">AI i praksis</a>
    <a href="dag-1.html" data-day-link>Tilbage til Dag 1</a>
  </div>
</nav>

<main>
  <header class="hero markdown-hero">
    <div class="hero-text">
      <span class="badge">Kursusmateriale</span>
      <h1 id="markdown-title">Indlæser materiale</h1>
      <p class="lead" id="markdown-source"></p>
    </div>
  </header>

  <article id="markdown-content" class="markdown-content" aria-live="polite"></article>
</main>

<footer>
  <div class="inner">
    AI i praksis. <a href="dag-1.html" data-day-link>Tilbage til Dag 1</a>
  </div>
</footer>

<script>
  // Henter og renderer én lokal markdownfil med saniteret HTML.
  (function () {
    var params = new URLSearchParams(location.search);
    var file = params.get('file') || '';
    var content = document.getElementById('markdown-content');
    var title = document.getElementById('markdown-title');
    var source = document.getElementById('markdown-source');

    /**
     * Peger tilbage-linkene på den kursusdag, materialet hører til.
     * @param {string} filePath Stien til markdownfilen fra ?file=.
     */
    function updateDayLinks(filePath) {
      var match = filePath.match(/Ai-i-praksis-dag(\d)/);
      if (!match) return;
      document.querySelectorAll('[data-day-link]').forEach(function (link) {
        link.href = 'dag-' + match[1] + '.html';
        link.textContent = 'Tilbage til Dag ' + match[1];
      });
    }

    /**
     * Gør relative links og billeder i materialet brugbare fra denne side.
     * Links til andre markdownfiler sendes gennem markdown.html, så de også bliver renderet.
     * @param {HTMLElement} container Elementet med det renderede materiale.
     * @param {URL} baseUrl Adressen på den markdownfil, indholdet kommer fra.
     */
    function resolveLinks(container, baseUrl) {
      var pageBase = new URL('.', location.href).href;
      container.querySelectorAll('a[href], img[src]').forEach(function (element) {
        var attribute = element.hasAttribute('href') ? 'href' : 'src';
        var value = element.getAttribute(attribute);
        if (!value || value.startsWith('#') || value.indexOf('://') !== -1) return;
        var absolute = new URL(value, baseUrl.href);
        if (attribute === 'href' && absolute.pathname.endsWith('.md') && absolute.href.indexOf(pageBase) === 0) {
          var relative = decodeURIComponent(absolute.href.slice(pageBase.length));
          element.setAttribute('href', 'markdown.html?file=' + encodeURIComponent(relative));
          return;
        }
        element.setAttribute(attribute, absolute.href);
        if (attribute === 'href') {
          element.target = '_blank';
          element.rel = 'noopener';
        }
      });
    }

    if (!file || !file.endsWith('.md') || file.indexOf('://') !== -1 || file.indexOf('..') !== -1) {
      title.textContent = 'Materialet kunne ikke åbnes';
      content.innerHTML = '<p>Linket til materialet er ikke gyldigt.</p>';
      return;
    }

    updateDayLinks(file);

    var sourceUrl = new URL(file, location.href);
    source.textContent = sourceUrl.pathname.split('/').pop();
    fetch(sourceUrl.href)
      .then(function (response) {
        if (!response.ok) throw new Error('Materialet blev ikke fundet');
        return response.text();
      })
      .then(function (markdown) {
        var rendered = DOMPurify.sanitize(marked.parse(markdown));
        content.innerHTML = rendered;
        var heading = content.querySelector('h1');
        if (heading) {
          title.textContent = heading.textContent;
          heading.remove();
          document.title = heading.textContent + ' | AI i praksis';
        } else {
          title.textContent = sourceUrl.pathname.split('/').pop().replace(/\.md$/, '');
        }
        resolveLinks(content, sourceUrl);
      })
      .catch(function () {
        title.textContent = 'Materialet kunne ikke åbnes';
        content.innerHTML = '<p>Der opstod en fejl ved indlæsning af materialet.</p>';
      });
  })();
</script>
</body>
</html>
